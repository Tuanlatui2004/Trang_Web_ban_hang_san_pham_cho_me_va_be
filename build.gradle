plugins {
    id 'java'
    id 'war'
}

group = 'vn.edu.hcmuaf.fit'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'

    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    implementation 'com.mysql:mysql-connector-j:9.0.0'
    implementation 'org.jdbi:jdbi3-core:3.47.0'
    implementation 'org.jdbi:jdbi3-sqlobject:3.47.0'
    implementation 'com.zaxxer:HikariCP:5.0.1'

    implementation 'com.cloudinary:cloudinary-http5:2.0.0'
    implementation 'com.cloudinary:cloudinary-taglib:2.0.0'

    implementation 'io.github.cdimascio:dotenv-java:3.1.0'
    implementation 'commons-fileupload:commons-fileupload:1.4'
    implementation 'commons-codec:commons-codec:1.14'
    implementation 'commons-io:commons-io:2.15.1'

    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.json:json:20240303'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    implementation 'ch.qos.logback:logback-classic:1.2.11'

    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    implementation 'com.google.apis:google-api-services-oauth2:v2-rev157-1.25.0'

    implementation 'com.sun.mail:jakarta.mail:2.0.1'

    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    implementation 'com.restfb:restfb:2023.9.0'

    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    implementation 'org.jetbrains:annotations:24.0.1'

    implementation 'javax.xml.bind:jaxb-api:2.3.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.2'
}

test {
    useJUnitPlatform()
}